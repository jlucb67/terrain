/* La carte occupe tout l'ecran. Recherche fine en haut, tiroir a crans au-dessus d'une barre de quatre missions en bas ; panneau a gauche sur grand ecran. */
:root{

}

 color-scheme:dark}}
:root[data-theme="dark"]{
 --brand:#6A1ED0; --brand-ink:#FFFFC4; --accent:#B79BFF; --cta:#E0392D; --cta-ink:#FFFFFF;

html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:400 14px/1.45 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
#app{position:fixed;inset:0;overflow:hidden;--tb:0px}
#app.tabs{--tb:calc(54px + env(safe-area-inset-bottom,0px))}
#map{position:absolute;inset:0;background:var(--ground)}
.leaflet-container{background:var(--ground);font-family:var(--f)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line2);box-shadow:var(--shadow)}

/* haut */
.top{position:absolute;left:0;right:0;top:0;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;pointer-events:none}
.top>*{pointer-events:auto}
.brandbar{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:12px}
.brandbar img{height:20px;width:auto}
.brandbar .lg-b{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brandbar .lg-v{display:none}:root:not([data-theme="light"]) .brandbar .lg-b{display:block}}
:root[data-theme="dark"] .brandbar .lg-v{display:none}:root[data-theme="dark"] .brandbar .lg-b{display:block}
.brandbar span{font:600 10.5px/1 var(--f);letter-spacing:.12em;color:var(--quiet);padding-left:10px;border-left:1px solid var(--line2)}
.search{display:flex;align-items:center;height:42px;padding:0 4px;border-radius:14px}
.ib{width:36px;height:36px;flex:none;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:var(--ink);position:relative}
.ib::after{content:"";position:absolute;inset:-4px}
.ib svg{width:18px;height:18px}
.search input{flex:1;min-width:0;height:36px;border:0;background:transparent;font:400 15px var(--f);color:var(--ink);padding:0 2px;outline:none}
.search input::placeholder{color:var(--quiet)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 4px;margin:0 -10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chips.t4{gap:3px}.chips.t4 .chip{padding:0 7px;font-size:11.5px}.chips.t4 .chip i{display:none}
.chip{flex:none;height:30px;padding:0 11px 0 9px;border-radius:15px;display:flex;align-items:center;gap:7px;font:500 12.5px var(--f);white-space:nowrap;color:var(--ink);position:relative}
.chip::after{content:"";position:absolute;inset:-7px -2px}
.chip i{width:8px;height:8px;border-radius:4px;flex:none}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:transparent;color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.chip[aria-pressed="false"]{color:var(--quiet)}
.chip[aria-pressed="false"] i{opacity:.45}
.results{margin-top:6px;border-radius:14px;max-height:min(56vh,420px);overflow:auto;padding:4px 0}
.res{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 12px}
.res:hover,.res:focus-visible{background:var(--fill)}
.res b{display:block;font:500 14px/1.3 var(--f)}
.res small{color:var(--quiet);font:400 12px var(--f)}
.res .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--fill);color:var(--accent)}
.res .ico svg{width:15px;height:15px}
.empty{padding:12px 0;color:var(--quiet)}
.results .empty{padding:10px 14px}

/* boutons flottants, groupes */
.fabs{position:absolute;right:10px;z-index:999;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;bottom:calc(var(--sh,150px) + var(--tb) + 10px);transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
.fab{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.fab+.fab{border-top:1px solid var(--line2)}
.fab svg{width:18px;height:18px}

/* tiroir */
.sheet{position:absolute;left:0;right:0;bottom:var(--tb);z-index:1001;height:var(--sh,150px);background:var(--solid);border-radius:18px 18px 0 0;
 box-shadow:0 -1px 0 var(--line2),0 -8px 28px rgba(30,20,50,.08);display:flex;flex-direction:column;transition:height .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
#app.tabs .sheet{padding-bottom:0}
.sheet.drag{transition:none}
.grab{flex:none;height:20px;display:grid;place-items:center;touch-action:none;cursor:grab}

.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 18px 22px}
.head{display:flex;align-items:flex-start;gap:6px;touch-action:none}
.head .tt{flex:1;min-width:0}
.back{margin:-5px 0 0 -10px}
h1{font:700 20px/1.15 var(--f);letter-spacing:-.015em;margin:0;text-wrap:balance}

.sub{color:var(--quiet);font:400 12.5px/1.4 var(--f);margin-top:3px}
.sub b{color:var(--ink);font-weight:600}
.acc{color:var(--accent)!important}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:10px 0 9px 12px}
.kpi:first-child{padding-left:0}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi b{display:block;font:600 17px/1.15 var(--f);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.kpi b small{font:500 11px var(--f);color:var(--quiet)}
.kpi span{display:block;font:400 11px/1.3 var(--f);color:var(--quiet);margin-top:2px}
.ztag{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.2 var(--f);color:var(--zc)}
.ztag i{width:8px;height:8px;border-radius:4px;background:var(--zc)}
.zdef{font:400 13px/1.4 var(--f);color:var(--quiet);margin-top:2px}
.meta{margin-top:12px}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;min-height:54px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .zd{width:8px;height:8px;border-radius:4px}
.row .tx{min-width:0;border:0;background:none;text-align:left;padding:8px 0}
.row .tx b{display:block;font:500 14px/1.3 var(--f);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx small{display:block;color:var(--quiet);font:400 12px/1.3 var(--f);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sc{font:600 13px var(--f);font-variant-numeric:tabular-nums;color:var(--ink);text-align:right}
.row .sc small{display:block;font:400 10.5px var(--f);color:var(--quiet)}
.row .nb{width:22px;height:22px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 11px var(--f);margin-left:-6px}
.row.n{grid-template-columns:22px minmax(0,1fr) auto auto}
.row.p{grid-template-columns:minmax(0,1fr) auto}
.addb{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line2);background:transparent;color:var(--accent);font:600 12px var(--f);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;position:relative}
.addb::after{content:"";position:absolute;inset:-8px -4px}
.addb svg{width:13px;height:13px}
.addb.in{background:var(--tint);border-color:transparent}
.rm{width:30px;height:30px;border-radius:15px;border:1px solid var(--line2);background:transparent;color:var(--quiet);display:grid;place-items:center;position:relative}
.rm::after{content:"";position:absolute;inset:-7px}
.rm svg{width:13px;height:13px}
.btn{width:100%;min-height:44px;border:1px solid transparent;border-radius:12px;font:600 14px var(--f);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 12px;text-align:center}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.cta{background:var(--cta);color:var(--cta-ink)}
.btn.line{background:transparent;border-color:var(--line2);color:var(--accent)}
.btns{display:grid;gap:8px;margin-top:16px}
.btns.two{grid-template-columns:1fr 1fr}
.bars{display:grid;gap:10px;margin-top:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center;font:400 13px var(--f)}
.bar b{font-weight:600;font-variant-numeric:tabular-nums}
.bar .tr{grid-column:1/-1;height:3px;border-radius:2px;background:var(--line)}
.bar .tr i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.bar.j{grid-template-columns:minmax(0,1fr);row-gap:3px}
.bar .jv{position:relative;height:17px;margin-top:-1px}
.bar .jv b{position:absolute;bottom:1px;transform:translateX(-50%);font:600 13.5px/16px var(--f);white-space:nowrap}
.bar .jv b.g{transform:none}
.bar .jv b.d{transform:translateX(-100%)}
.bar.lj{margin-top:10px}
.bar.lj .jv b{font-weight:400;font-size:11px;color:var(--quiet)}
.puces{margin:12px 0 0;padding:0 0 0 18px;font:400 13px/1.45 var(--f)}
.puces li{margin:6px 0}
.puces li::marker{color:var(--quiet)}
.bar.j .tr{height:6px;border-radius:3px;position:relative;margin-top:2px}
.bar.j .tr i{border-radius:3px}
.bar.j .tr u{position:absolute;top:-4px;width:2px;height:14px;margin-left:-1px;border-radius:1px;background:var(--ink)}
.bar .jl{grid-column:1/-1;position:relative;height:13px;margin-top:2px;font:400 11px/13px var(--f);color:var(--quiet);font-variant-numeric:tabular-nums}
.bar .jl em{position:absolute;top:0;font-style:normal;white-space:nowrap}
.bar .jl em.md{transform:translateX(-50%)}
.bar .jl em.md.g{transform:translateX(-3px)}
.bar .jl em.md.d{transform:translateX(calc(-100% + 3px))}
.bar .jl em.mx{right:0}
.lines{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.lines.s{margin-top:3px;gap:3px}
.ln{min-width:22px;height:22px;padding:0 5px;border-radius:11px;display:grid;place-items:center;font:700 11px var(--f)}
.lines.s .ln{min-width:16px;height:16px;padding:0 4px;font-size:9.5px;border-radius:8px}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;padding:2px;margin-top:12px}
.seg button{flex:1;border:0;background:none;border-radius:8px;height:34px;padding:0 4px;font:500 12.5px var(--f);color:var(--quiet);white-space:nowrap;position:relative;min-width:0}
.seg button::after{content:"";position:absolute;inset:-5px 0}
.seg button[aria-pressed="true"]{background:var(--tint);color:var(--accent)}
.mom{margin-top:12px}
.mom .jr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mom .jr button{border:1px solid var(--line2);background:var(--solid);border-radius:10px;height:36px;padding:0;font:500 12.5px var(--f);color:var(--ink);min-width:0}
.mom .jr button.auj{border-color:var(--accent)}
.mom .jr button[aria-pressed="true"],.mom .hr .now[aria-pressed="true"]{background:var(--tint);border-color:transparent;color:var(--accent);font-weight:650}
.mom .hr .now{margin-left:auto;width:auto;padding:0 12px;font:500 13px var(--f)}
.mom .hr{display:flex;align-items:center;gap:10px;margin-top:8px}
.mom .hr span{font:400 13px var(--f);color:var(--quiet)}
.mom .hr b{min-width:96px;text-align:center;font:650 15px var(--f);color:var(--ink)}
.mom .hr button{width:44px;height:36px;border:1px solid var(--line2);background:var(--solid);border-radius:10px;font:500 18px var(--f);color:var(--ink)}
.prs{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:999px;font:600 11.5px/1.5 var(--f);background:var(--p0);color:var(--ink)}
.prs.q1{background:var(--p1);color:var(--ink)}.prs.q2{background:var(--p2);color:#fff}.prs.q3{background:var(--p3);color:#fff}.prs.q4{background:var(--p4);color:#fff}
.tsec{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tsec .more{border:0;background:none;color:var(--accent);font:600 13px var(--f);padding:8px 0}
.mk-p{background:var(--pied);color:#fff;border-radius:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tags span{padding:3px 9px;border-radius:999px;background:var(--fill);font:500 12px/1.5 var(--f);color:var(--ink)}
.dim{opacity:.38}
.chart{margin-top:12px}
.chart svg{width:100%;height:auto}
.peak{margin-top:8px;font:400 13px/1.45 var(--f)}
.peak b{color:var(--accent);font-weight:600}
.hours{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;font:400 13.5px var(--f)}
.leg{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;margin:10px 0;font:400 13px/1.45 var(--f)}
.leg i{width:10px;height:10px;border-radius:5px;display:block;margin:4px 0 0 6px}
.leg b{font-weight:600}
.src{font:400 12px/1.5 var(--f);color:var(--quiet)}
.pap-sum{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font:400 12.5px var(--f);color:var(--quiet)}
.pap-sum b{color:var(--ink);font-weight:600}
.frow{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.frow b{font:500 14px/1.3 var(--f)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border:1px solid var(--line2);border-radius:10px;height:42px}
.step button{width:100%;height:40px;border:0;background:none;font:400 16px var(--f);color:var(--accent)}
.step span{text-align:center;font:600 15px/1 var(--f);font-variant-numeric:tabular-nums}
.step small{display:block;font:400 10.5px var(--f);color:var(--quiet);margin-top:2px}
label.fld{display:block;margin-top:16px;font:500 12px var(--f);color:var(--quiet)}
label.fld input{display:block;width:100%;margin-top:6px;height:42px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--ink);font:400 15px var(--f);padding:0 12px}
.ok{display:grid;place-items:center;text-align:center;padding:16px 0 2px}
.ok .ck{width:48px;height:48px;border-radius:24px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.ok .ck svg{width:22px;height:22px}
.ok h1{margin-top:12px}
.load{padding:20px 0;color:var(--quiet)}
.start{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.start .btn{font-size:13px;white-space:nowrap;padding:0 8px;gap:6px}
