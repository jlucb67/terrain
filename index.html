.chev{color:var(--quiet)}.chev svg{width:16px;height:16px}

.frow2 select{height:40px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--ink);font:500 13px var(--f);padding:0 8px;min-width:0}
.frow2 .seg{margin-top:0}
.two-f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fl select{width:100%;height:44px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--ink);font:500 14px var(--f);padding:0 10px}
.ch2.num button{min-width:44px;padding:0;text-align:center}
.bb.big{margin-top:8px}.bb.big button{flex:1;height:44px}
.slc.off{opacity:.45}.slc.off output{font-size:11.5px;color:var(--quiet)}
.pin.sel{background:var(--solid);color:var(--accent);border:1.5px solid var(--accent)}
.addn.two{grid-template-columns:minmax(0,1fr) auto;margin-top:10px}
.search .moi{margin-left:2px}
.mbtn{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);padding:0}
.mbtn[hidden]{display:none}.mbtn svg{width:19px;height:19px}
.mback{position:fixed;inset:0;z-index:1490}
.menu{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:1500;width:276px;max-width:calc(100% - 20px);border-radius:16px;padding:6px;background:var(--solid);border:1px solid var(--line2);box-shadow:var(--shadow)}
.menu[hidden],.mback[hidden]{display:none}
.menu .mh{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .mh b{display:block;font:600 15px/1.3 var(--f)}.menu .mh span{display:block;font:400 12px/1.4 var(--f);color:var(--quiet);margin-top:2px}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 12px;border:0;background:none;border-radius:10px;font:500 14px var(--f);color:var(--ink);text-align:left}
.mi svg{width:18px;height:18px;color:var(--quiet);flex:none}
.mi:hover,.mi:focus-visible{background:var(--fill)}
.mi.adm{color:var(--accent);font-weight:600}.mi.adm svg{color:var(--accent)}
.mi.th{display:block;padding:8px 12px 10px;min-height:0}.mi.th>span{font:500 12px var(--f);color:var(--quiet)}.mi.th .seg{margin-top:6px}
.menu .sep{height:1px;background:var(--line);margin:4px 6px}
.ib.par{width:auto;padding:0 8px 0 2px;gap:0;display:flex;align-items:center;font:600 13px var(--f);color:var(--accent)}
.ib.par svg{width:17px;height:17px}
.login{position:fixed;inset:0;z-index:2000;background:var(--ground);display:grid;place-items:center;padding:24px 20px;overflow:auto}
.login[hidden]{display:none}
.lg-in{width:100%;max-width:360px}
.lg-logo{display:flex;align-items:center;gap:12px;margin-bottom:36px}
.lg-logo img{height:26px;width:auto}.lg-logo .lg-b{display:none}
.lg-logo span{font:600 11px/1 var(--f);letter-spacing:.14em;color:var(--quiet);padding-left:12px;border-left:1px solid var(--line2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-logo .lg-v{display:none}:root:not([data-theme="light"]) .lg-logo .lg-b{display:block}}
:root[data-theme="dark"] .lg-logo .lg-v{display:none}:root[data-theme="dark"] .lg-logo .lg-b{display:block}
.login h1{font-size:26px}
.login select,.kw input{display:block;width:100%;margin-top:6px;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--solid);color:var(--ink);font:400 15px var(--f);padding:0 12px}
.kw{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:6px;align-items:end}
.kw .ib{width:46px;height:46px;border:1px solid var(--line2);border-radius:12px;background:var(--solid);color:var(--accent)}
.lg-err{margin-top:12px;font:500 13px/1.4 var(--f);color:var(--cta)}
.login .btns{margin-top:22px}
/* barre des missions */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:1002;height:var(--tb);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--solid);border-top:.5px solid var(--line2);display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar[hidden]{display:none}
.tabbar button{border:0;background:none;display:grid;justify-items:center;align-content:center;gap:3px;font:500 10.5px/1 var(--f);letter-spacing:.01em;color:var(--ink);height:54px;opacity:.56;padding:0 2px;white-space:nowrap}
.tabbar i{display:grid;place-items:center;height:22px}
.tabbar svg{width:20px;height:20px;stroke-width:1.5}
.tabbar button[aria-selected="true"]{color:var(--accent);opacity:1;font-weight:650}
.tabbar button[aria-selected="true"] svg{stroke-width:1.8}

/* marqueurs */
.mk{display:grid;place-items:center;border-radius:50%;border:1.25px solid var(--solid);box-shadow:0 .5px 2px rgba(0,0,0,.25)}
.mk svg{width:60%;height:60%}
.mk-m{background:var(--ink);color:var(--solid);font:700 8px/1 var(--f)}
.mk-ma{background:#2E7D4F;color:#fff;border-radius:4px}
.mk-c{background:var(--quiet);color:var(--solid);border-radius:3px}
.mk-c.g{background:var(--charbon);color:#fff}
.mkl{display:flex;align-items:center;gap:6px;white-space:nowrap;width:max-content}
.mkl span{font:600 11.5px var(--f);color:var(--ink);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 2px var(--halo)}
.pin{width:26px;height:26px;border-radius:13px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 11px var(--f);box-shadow:0 1px 4px rgba(0,0,0,.3);border:1.5px solid var(--solid)}
.pin.lot{background:var(--solid);color:var(--accent);border:1.5px solid var(--accent)}
.start-pin{width:14px;height:14px;border-radius:7px;background:var(--accent);border:2px solid var(--solid);box-shadow:0 0 0 6px var(--tint)}
.cl{position:absolute;left:0;top:0;width:max-content;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;line-height:1;pointer-events:none;color:var(--oink-lo)}
.cl.hi{color:var(--oink-hi);text-shadow:0 0 1px var(--chalo),0 0 2px var(--chalo),0 0 4px var(--chalo)}
.cl b{display:block;font:700 12px/1 var(--f);letter-spacing:-.01em}
.cl span{display:block;font:500 10px/1 var(--f);margin-top:2px;opacity:.9;font-variant-numeric:tabular-nums}
.nm{white-space:nowrap;font:500 10.5px var(--f);color:var(--label);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 2px var(--halo);pointer-events:none;letter-spacing:.02em}
.bvl{white-space:nowrap;font:700 10px var(--f);color:var(--bv-label);pointer-events:none}
.stn{white-space:nowrap;font:600 11px var(--f);color:var(--ink);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 2px var(--halo);pointer-events:none}
.me{width:14px;height:14px;border-radius:7px;background:#1A73E8;border:2px solid #fff;box-shadow:0 0 0 7px rgba(26,115,232,.18)}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);z-index:2100;background:var(--ink);color:var(--solid);font:500 13px/1.35 var(--f);padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:calc(100% - 40px);text-align:center}

/* grand ecran : panneau a gauche */
@media (min-width:900px){
 .top{right:auto;width:380px;left:16px;padding-top:16px}
 .sheet{left:16px;right:auto;width:380px;bottom:calc(16px + var(--tb));top:110px;height:auto!important;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line2)}
 #app.tabs .sheet{border-radius:16px 16px 0 0;border-bottom:0}
 .sheet.paris{top:70px}
 .tabbar{left:16px;right:auto;width:380px;bottom:16px;height:54px;padding:0;border:1px solid var(--line2);border-radius:0 0 16px 16px;box-shadow:var(--shadow)}
 #app.tabs{--tb:54px}
 .grab{display:none}
 .body{padding-top:16px}
 .fabs{bottom:16px!important;right:16px}
 .toast{left:calc(16px + 190px)}
}
@media (prefers-reduced-motion:reduce){.sheet,.fabs{transition:none}}

const dist=(a,b)=>{const R=6371e3,r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r,x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x));};

 const out=[],pris=new Set();let cur=ll,s=0,km=0,msg='';
 if(i0!=null){if(ok(i0)){out.push(i0);pris.add(i0);s+=D.adresses[i0][3];cur=ptA(i0);}
  else msg=`${D.adresses[i0][2]} ${recente(i0)?'a été faite récemment':pasEntreRecent(i0)?'était fermée il y a peu':'n\'est pas prioritaire'} : l'action part des adresses prioritaires les plus proches.`;}

  for(const lim of (out.length?[250,400]:[300,600])){
   for(const strict of (out.length?[true]:[true,false])){
    for(const i of C){if(pris.has(i))continue;const a=D.adresses[i];if(strict&&a[3]>Math.max(reste*1.5,12))continue;const d=dist(cur,ptA(i));if(d>lim)continue;const v=a[3]*(a[5]/100)/(d+40);if(v>bv){bv=v;bi=i;bd=d;}}

   if(bi>=0)break;}
  if(bi<0)break;if(out.length)km+=bd;out.push(bi);pris.add(bi);s+=D.adresses[bi][3];cur=ptA(bi);}

/* ---------------- diff en marche */
function seances(s){const out=[];s.horaires.forEach(t=>{const m=/^(.*?)\s*:\s*de\s*(\d+)\s*h\s*(\d*)\s*à\s*(\d+)\s*h\s*(\d*)/.exec(t);if(!m)return;
 m[1].split(/\s*,\s*|\s+et\s+/).forEach(j=>{const d=JOURS.indexOf(j.trim().toLowerCase());if(d>=0)out.push({d,h0:+m[2]+(+m[3]||0)/60,h1:+m[4]+(+m[5]||0)/60,deb:`${m[2]} h${m[3]?' '+m[3]:''}`,fin:`${m[4]} h${m[5]?' '+m[5]:''}`});});});return out;}
function prochaine(s){const now=new Date(),dn=now.getDay(),hn=now.getHours()+now.getMinutes()/60;let best=null;
 seances(s).forEach(x=>{let dd=(x.d-dn+7)%7;if(dd===0&&hn>=x.h1)dd=7;const ouvert=dd===0&&hn>=x.h0&&hn<x.h1;const t=ouvert?0:dd*24+x.h0-(dd===0?hn:0);
  if(!best||t<best.t)best={t,dd,ouvert,x};});return best;}
function quand(b){if(!b)return 'Horaires inconnus';if(b.ouvert)return `Ouvert maintenant, jusqu'à ${b.x.fin}`;

 const vals=D.metro.map(s=>valeurStation(s,vueMetroJour)),mx=Math.max(...vals,1),ac=tok('--accent');
 D.metro.forEach((s,k)=>{const r=5+22*Math.sqrt(vals[k]/mx);L.circleMarker([s.lat,s.lon],{renderer:rA,radius:r,color:ac,weight:1.2,opacity:.9,fillColor:ac,fillOpacity:.18}).on('click',()=>ouvrirStation(s)).addTo(bulles);});
 if(!map.hasLayer(bulles))bulles.addTo(map);}

const lignesHTML=s=>`<span class="lines s">${s.lignes.map(l=>{const c=LIGNE[l]||['#888','#fff'];return `<span class="ln" style="background:${c[0]};color:${c[1]}">${esc(l)}</span>`;}).join('')}</span>`;
function vueMetro(){return {id:'base',html:()=>{const n=new Date(),j=vueMetroJour,hs=n.getHours(),h1=(hs+1)%24,h2=(hs+2)%24;
  const ref=j==='pres'?(posMoi||(()=>{const c=centreVisible();return [c.lat,c.lng];})()):null;

  ss.sort(j==='pres'?(a,b)=>a.d-b.d:(a,b)=>b.v-a.v);if(j==='pres')ss=ss.slice(0,8);
  const sub=j==='now'?`${cap(JOURS[n.getDay()])} : entrées moyennes de ${hs} h à ${h1} h, puis de ${h1} h à ${h2} h`:j==='pres'?(posMoi?'Les stations les plus proches de vous':'Les stations les plus proches du centre de la carte. Touchez « Me localiser » pour partir de vous.'):'Stations de la circonscription et alentour, par entrées par jour';

  h+=`<div style="margin-top:6px">${ss.map(o=>{const pk=(j==='sem'||j==='sam'||j==='dim')&&o.s[j]?pointesTxt(o.s[j]):'',lim=!dansCirco([o.s.lat,o.s.lon]);
   const info=j==='now'?`${n0(entreesH(o.s,hs))} entrées de ${hs} h à ${h1} h · ${n0(entreesH(o.s,h1))} de ${h1} h à ${h2} h`:j==='pres'?`${o.d<1000?Math.round(o.d/10)*10+' m':(o.d/1000).toFixed(1).replace('.',',')+' km'} · ${n0(entreesH(o.s,h1))} entrées de ${h1} h à ${h2} h`:`${n0(o.s.jour)} entrées par jour · pointes à ${pk}`;
   return `<div class="row p"><button class="tx" data-st="${D.metro.indexOf(o.s)}"><b>${esc(o.s.nom)}${lim?' <span class="lim">limite de circo</span>':''}</b><small>${info}${derniereDiff(o.s.nom)}</small>${lignesHTML(o.s)}</button><button class="addb" data-ds="${D.metro.indexOf(o.s)}">${I.tract}Diff faite</button></div>`;}).join('')}</div>`;
  h+=`<div class="hint">Moyennes d'Île-de-France Mobilités, 4e trimestre 2025. Le matin, ce sont surtout des habitants qui partent.</div>`+lienCR();
  return h;},after:()=>{body.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{vueMetroJour=b.dataset.j;majBulles();render(true);if(vueMetroJour==='pres'&&!posMoi)localiser(ll=>{posMoi=ll;render(true);},true);});
  body.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>ouvrirStation(D.metro[+b.dataset.st]));
  body.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>detail(vueDiff(D.metro[+b.dataset.ds].nom,'station')));}};}
function chartH(v){const w=320,hh=80,bw=w/HEURES.length,mx=Math.max(...HEURES.map(h=>v[h]),1),top=HEURES.slice().sort((x,y)=>v[y]-v[x]).slice(0,3),hn=new Date().getHours();
 let s=`<svg viewBox="0 0 ${w} ${hh+18}" role="img" aria-label="Entrées par heure">`;
 HEURES.forEach((h,i)=>{const y=hh*v[h]/mx;s+=`<rect x="${i*bw+3}" y="${hh-y}" width="${bw-6}" height="${Math.max(1,y)}" rx="1.5" style="fill:${top.includes(h)?'var(--accent)':'var(--line2)'}"></rect>`;});
 s+=`<line x1="0" x2="${w}" y1="${hh+.5}" y2="${hh+.5}" style="stroke:var(--line2);stroke-width:1"></line>`;
 if(hn>=5)s+=`<line x1="${(hn-5+.5)*bw}" x2="${(hn-5+.5)*bw}" y1="0" y2="${hh}" style="stroke:var(--cta);stroke-width:1;stroke-dasharray:2 3"></line>`;
 [6,9,12,15,18,21].forEach(h=>{s+=`<text x="${(h-5+.5)*bw}" y="${hh+14}" text-anchor="middle" style="fill:var(--quiet);font:400 10px var(--f)">${h} h</text>`;});
 return s+'</svg>';}
const pointes=v=>HEURES.slice().sort((x,y)=>v[y]-v[x]).slice(0,3).sort((x,y)=>x-y).map(h=>`<b>${h} h</b> (${pc(v[h])})`).join(', ');
function ouvrirStation(s){sel(null);if(det==='peek')setDet('half');voir([s.lat,s.lon],Math.max(map.getZoom(),15.5));let jour=typeJour(new Date());

/* compte rendu de diff : une action faite en direct ; saisie au clavier, date, campagne et GA */
function vueDiff(nom,type,aid){const e=aid?actPar(aid):null;const brd=LS.get('brd'+D.k,null);const rep=!e&&brd&&brd.nom===nom&&(Date.now()-brd.ts)<72e5?brd:null;
 const d0=nouvelleAction(TYPE_DIFF[type]||'diff_marche');
 let tr=e?e.tracts:rep?rep.tr:0,q=e?e.faite_le:rep?rep.q:isoD(new Date()),nb=e?(e.nb||1):rep?rep.nb:nbm,camp=e?e.campagne:(LS.get('dcamp',null)||d0.campagne),ga=e?e.ga.slice():(LS.get('dga',null)||d0.ga).filter(g=>gaActifs().some(x=>x.id===g)),mat=e?e.materiel:'';
 const garde=()=>{if(!e)LS.set('brd'+D.k,{nom,tr,q,nb,ts:Date.now()});};
 return {id:'fini',aid:e?e.id:null,html:()=>{
  let h=headHTML(e?'Modifier la diff':'Diff faite',esc(nom),true);
  if(rep&&!e)h+=`<div class="note">Saisie reprise là où vous l'aviez laissée.</div>`;
  h+=`<div class="trc"><label for="trv">Tracts distribués</label><input id="trv" inputmode="numeric" pattern="[0-9]*" value="${tr}"></div><div class="trb">${[-10,10,50,100].map(d=>`<button data-d="${d}" aria-label="${d>0?'Ajouter':'Retirer'} ${Math.abs(d)} tracts">${d>0?'+':'−'}${Math.abs(d)}</button>`).join('')}</div>`;
  h+=quandHTML(q,'Début de la diff');
  const hors=type==='marché'&&!seanceLe(nom,q),lock=interdit(q);
  if(hors)h+=`<div class="note">Le ${esc(nom.replace(/^Marché /,'marché '))} n'a pas lieu le ${JOURS[toD(q).getDay()]}. Vérifiez la date.</div>`;
  if(lock)h+=`<div class="note">Distribution interdite à cette date : veille ou jour de scrutin (code électoral, article L. 49).</div>`;
  h+=nbHTML(nb);
  h+=`<div class="fl"><span>Campagne</span><div class="ch2">${REF.campagnes.filter(c=>!c.archive||c.id===camp).map(c=>`<button data-cp="${c.id}" aria-pressed="${camp===c.id}">${esc(c.nom)}</button>`).join('')}</div></div>`;
  h+=`<div class="fl"><span>Groupes d'action</span><div class="ch2">${gaActifs().map(g=>`<button data-g="${g.id}" aria-pressed="${ga.includes(g.id)}">${esc(g.nom)}</button>`).join('')}</div></div>`;
  h+=matHTML(mat,camp);
  const ok=tr>0&&camp&&ga.length&&!lock;
  h+=`<div class="btns stick"><button class="btn cta" id="env" ${ok?'':'disabled'}>${I.check} ${hors?'Enregistrer quand même':e?'Enregistrer':'Enregistrer le compte rendu'}</button>${ok||lock?'':`<div class="hint" id="hTr">${tr>0?'Choisissez une campagne et au moins un GA.':'Indiquez le nombre de tracts distribués.'}</div>`}</div>`;
  if(e&&peutSupprimer(e))h+=`<div class="btns"><button class="btn line danger" id="del">Supprimer ce compte rendu</button></div>`;
  if(e)h+=histoSaisies(e);
  return h;},
 after:()=>{lierQuand(()=>q,v=>{q=v;garde();});
  const tv=$('trv');tv.onfocus=()=>{try{tv.select();}catch(x){}};tv.oninput=()=>{const v=parseInt(tv.value.replace(/\D/g,''),10);tr=isNaN(v)?0:v;garde();const b=$('env');if(b)b.disabled=!(tr>0&&camp&&ga.length&&!interdit(q));const hh=$('hTr');if(hh)hh.hidden=tr>0&&camp&&ga.length;};
  body.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{tr=Math.max(0,tr+(+b.dataset.d));garde();render(true);});
  lierCpt(()=>nb,(x,v)=>{nb=Math.max(1,v);if(!e){nbm=nb;LS.set('nbm',nb);}garde();});
  body.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{camp=b.dataset.cp;render(true);});
  body.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=b.dataset.g,k=ga.indexOf(g);if(k>=0)ga.splice(k,1);else ga.push(g);render(true);});
  lierMat(v=>mat=v);
  const dl=$('del');if(dl)dl.onclick=()=>{const k=ACTIONS.indexOf(e);ACTIONS.splice(k,1);sauverA();back();toast('Compte rendu supprimé',{t:'Annuler',fn:()=>{ACTIONS.splice(k,0,e);sauverA();render(true);}});};
  $('env').onclick=()=>{if(!(tr>0))return;const lieuId=nom;
   if(e){Object.assign(e,{tracts:tr,faite_le:q,nb,campagne:camp,ga:ga.slice(),materiel:mat});saisie(e,'compte rendu modifié');sauverA();back();toast('Diff du '+fmtJ(q)+' enregistrée');return;}
   const x=nouvelleAction(TYPE_DIFF[type]||'diff_marche',{statut:'faite',faite_le:q,nb,tracts:tr,campagne:camp,ga:ga.slice(),materiel:mat,etapes:[{lieu:{t:LT[type]||'marche',id:lieuId},portes:0,toquees:0,ouvertes:0,st:'',acc:'',boites:0,le:q}]});
   x.nom=`${TYPES_C[x.type]} ${nom.replace(/^Marché /,'')}`;ACTIONS.push(x);saisie(x,'diff faite');sauverA();LS.set('brd'+D.k,null);LS.set('dcamp',camp);LS.set('dga',ga);
   stack=[vueBase(),{id:'ok',html:()=>`<div class="ok"><div class="ck">${I.check}</div><h1>Compte rendu enregistré</h1><div class="sub">${esc(nom)} · ${n0(tr)} tracts · ${fmtJH(q)}</div><div class="sub">Sur ce téléphone. Il partira au journal terrain quand l'envoi sera branché.</div></div><div class="btns"><button class="btn line" id="sh">Partager le compte rendu</button><button class="btn primary" id="nv">Revenir à la liste</button></div>`,

 Object.values(VOIES).forEach(l=>l.sort((x,y)=>ADRP[x].num-ADRP[y].num||ADRP[x].suf.localeCompare(ADRP[y].suf)));}
const ordreRue=v=>{const l=VOIES[v]||[];return [...l.filter(i=>ADRP[i].num%2===0),...l.filter(i=>ADRP[i].num%2===1).reverse()];};
const numTxt=i=>{const p=ADRP[i];return p.num?p.num+(p.suf?' '+p.suf:''):D.adresses[i][2];};

function construireTour(ll,cible){const vus=new Set(),ids=[];let s=0,cur=ll;
 while(s<cible){let bv=null,bd=1e9;for(const v in VOIES){if(vus.has(v))continue;for(const i of VOIES[v]){if(!libreB(i))continue;const d=dist(cur,ptA(i));if(d<bd){bd=d;bv=v;}}}
  if(!bv||bd>(ids.length?250:500))break;vus.add(bv);
  let ord=ordreRue(bv).filter(libreB);if(ord.length>1&&dist(cur,ptA(ord[ord.length-1]))<dist(cur,ptA(ord[0])))ord.reverse();
  for(const i of ord){if(s>=cible)break;ids.push(i);s+=D.adresses[i][3];cur=ptA(i);}}
 return {ids,ins:s};}

   if(j>=0)REF.users[j]=x;else REF.users.push(x);sauverREF();back();toast(j>=0?'Fiche modifiée':x.nom+' ajouté à la liste');};}};}
function vueReglages(){const R=JSON.parse(JSON.stringify(REF.reglages));R.scrutins=R.scrutins||[];let nd='';
 return {id:'reglages',html:()=>{let h=headHTML('Réglages','',true);
  h+=`<div class="cpts one">${cptHTML('delaiFaite','Jours avant de reproposer une adresse faite',R.delaiFaite)}${cptHTML('delaiFerme','Jours avant de reproposer une adresse fermée',R.delaiFerme)}</div>`;
  h+=`<div class="fl"><span>Taille de PAP proposée par défaut</span><div class="seg" role="group">${[50,100,150,200].map(t=>`<button data-tl="${t}" aria-pressed="${R.taille===t}">${t} inscrits</button>`).join('')}</div></div>`;
  h+=`<h2>Dates de scrutin</h2><div class="hint">La diff et le boîtage sont bloqués de la veille à 0 h jusqu'à la fin du jour du scrutin (code électoral, article L. 49).</div>`;
  h+=R.scrutins.map((s,j)=>`<div class="row p"><div class="tx"><b>${fmtJH(s)}</b></div><button class="rm" data-sd="${j}" aria-label="Retirer">${I.x}</button></div>`).join('');
  h+=`<div class="addn two"><input type="date" id="nd" value="${nd}" aria-label="Date de scrutin"><button class="btn line" id="ndok">Ajouter</button></div>`;
  h+=`<div class="btns stick"><button class="btn primary" id="sv">${I.check} Enregistrer</button></div>`;return h;},
 after:()=>{lierCpt(k=>R[k],(k,v)=>{R[k]=Math.max(1,v);});body.querySelectorAll('[data-tl]').forEach(b=>b.onclick=()=>{R.taille=+b.dataset.tl;render(true);});
  body.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{R.scrutins.splice(+b.dataset.sd,1);render(true);});
  $('nd').onchange=e=>{nd=e.target.value;};$('ndok').onclick=()=>{if(nd){R.scrutins.push(nd);R.scrutins.sort();nd='';render(true);}};
  $('sv').onclick=()=>{REF.reglages=R;sauverREF();taille=R.taille;back();toast('Réglages enregistrés');};}};}
function vueControles(){return {id:'controles',html:()=>{const l=aVerifier();let h=headHTML('Contrôles',l.length?`${pl(l.length,'saisie','saisies')} à vérifier`:'Rien à vérifier',true);
  h+=l.map(([a,r])=>`<div class="row p"><button class="tx" data-act="${a.id}"><b>${esc(a.nom)}</b><small>${esc(r)} · ${resumeA(a)}</small></button></div>`).join('');return h;}};}
function vueDonnees(){return {id:'donnees',html:()=>{let h=headHTML('Données','Fournies par l\'Agent Électoral, en lecture seule',true);
  h+=`<div class="meta2"><div><span>Fichier</span><b>circo_${pad2(D.k)}</b></div><div><span>Modèle</span><b>Paris 2027 v5.7</b></div><div><span>Adresses</span><b>${n0(D.adresses.length)}</b></div></div>`;
  h+=`<div class="src" style="margin-top:12px">Ville de Paris (bureaux de vote, voirie, espaces verts, voies d'eau, marchés), IGN (bâti), Île-de-France Mobilités (entrées par heure, 4e trimestre 2025), Apur (commerces 2023), Insee (quartiers), modèle Paris 2027 v5.7. ${esc(D.ni_src||'')}</div>`;return h;}};}
/* menu : actions, circonscription, legende, affichage, administration (administrateurs), deconnexion */
function ouvrirMenu(){const m=$('menu'),u=moi(),t=themeDe(),enCirco=!!(D&&!$('searchbox').hidden);$('res').hidden=true;
 m.innerHTML=`<div class="mh"><b>${esc(u.nom)}</b><span>${u.profil==='admin'?'Administrateur':'Utilisateur'}${u.ga.length?' · '+u.ga.map(g=>esc(gaNom(g))).join(', '):''}</span></div>`+
  (enCirco?`<button class="mi" role="menuitem" data-mi="actions">${I.list}<span>Toutes les actions</span></button><button class="mi" role="menuitem" data-mi="paris">${I.carte}<span>Changer de circonscription</span></button><button class="mi" role="menuitem" data-mi="legende">${I.couches}<span>Légende</span></button><div class="sep"></div>`:'')+
  `<div class="mi th"><span>Affichage</span><div class="seg sm" role="group" aria-label="Affichage">${[['auto','Téléphone'],['clair','Clair'],['sombre','Sombre']].map(([k,x])=>`<button data-th="${k}" aria-pressed="${t===k}">${x}</button>`).join('')}</div></div><div class="sep"></div>`+
  (estAdmin()?`<button class="mi adm" role="menuitem" data-mi="admin">${I.admin}<span>Administration</span></button>`:'')+
  `<button class="mi" role="menuitem" data-mi="deco">${I.sortie}<span>Se déconnecter</span></button>`;
 m.hidden=false;$('mback').hidden=false;
 m.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{LS.set('theme_'+MOI,b.dataset.th);appliquerTheme();m.querySelectorAll('[data-th]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
 m.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{const k=b.dataset.mi;fermerMenu();
  if(k==='actions'){if(det==='peek')setDet('half');detail(vueActions({type:'tous'}));}
  else if(k==='paris'){$('q').value='';ecranParis();}
  else if(k==='legende'){if(det==='peek')setDet('half');detail(vueLegende());}
  else if(k==='admin'){const go=()=>{setDet('half');detail(vueConsole());};if(enCirco)go();else ouvrir(+LS.get('dernCirco',6)||6,go);}
  else if(k==='deco')deconnecter();});}
function fermerMenu(){$('menu').hidden=true;$('mback').hidden=true;}
$('moi').onclick=ouvrirMenu;$('menuP').onclick=ouvrirMenu;$('mback').onclick=fermerMenu;
addEventListener('keydown',e=>{if(e.key==='Escape')fermerMenu();});

/* ---------------- legende */
function vueLegende(){return {id:'leg',html:()=>{let h=headHTML('Légende','',true);
 h+=`<h2>Zones</h2>`+[1,2,3].map(z=>`<div class="leg"><i style="background:var(--z${z})"></i><div><b>Zone n°${z}</b>, ${ZD[z]}</div></div>`).join('');
 h+=`<h2>Adresses</h2><div class="leg"><i style="background:var(--z1)"></i><div>Rond plein en couleur : adresse prioritaire selon vos curseurs (score de ${crit.score} et plus, ${pl(crit.ins,'inscrit')} ou plus${crit.ni>0?`, ${pl(crit.ni,'non-inscrit')} estimé${crit.ni>1?'s':''} ou plus`:''}), dans la couleur de sa zone.</div></div>
  <div class="leg"><i style="background:var(--dot)"></i><div>Rond gris : les autres adresses.</div></div><div class="leg"><i class="creux"></i><div>Rond creux violet : adresse faite (porte-à-porte) ou numéro boîté (boîtage).</div></div><div class="leg"><i class="creux pt"></i><div>Rond creux en pointillé : pas pu entrer, ou boîtes fermées.</div></div><div class="leg"><span></span><div>La taille du point dit le nombre d'inscrits.</div></div>`;
 h+=`<h2>Lieux</h2>${[['mk-m','M','Station de métro',14],['mk-ma',I.basket,'Marché',18],['mk-c g',I.cart,'Supermarché',14],['mk-c','','Supérette',9]].map(([c,x,t,s])=>`<div class="leg"><div class="mk ${c}" style="width:${s}px;height:${s}px;margin:2px 0 0 ${(22-s)/2}px">${x}</div><div>${t}</div></div>`).join('')}
  <div class="leg"><span></span><div>Dans la mission Métro, la taille du cercle dit le nombre d'entrées.</div></div>`;
 h+=`<h2>Sources</h2><div class="src">Ville de Paris (bureaux de vote, voirie, espaces verts, voies d'eau, marchés), IGN (bâti), Île-de-France Mobilités (entrées par heure, 4e trimestre 2025), Apur (commerces 2023), Insee (quartiers), modèle Paris 2027 v5.7. ${esc(D.ni_src||'')}</div>`;
 return h;}};}

/* ---------------- recherche : accents, fautes d'une lettre, bis et ter */
let IDX=[];
const normA=s=>norm(s).replace(/\b(\d+) ?(bis|b)\b/g,'$1b').replace(/\b(\d+) ?(ter|t)\b/g,'$1t');
function near1(a,b){if(a===b)return true;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;let i=0,j=0,e=0;
 while(i<la&&j<lb){if(a[i]===b[j]){i++;j++;continue;}if(++e>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++;}}return e+(la-i)+(lb-j)<=1;}
function indexer(){IDX=[];
 Object.keys(VOIES).forEach(v=>IDX.push({t:v,s:pl(VOIES[v].length,'numéro'),k:'Rue',n:normA(v),r:1,go:()=>vueRueOuvrir(v)}));
 D.fond.noms.forEach(x=>{const k=normA(x[3]);if(!IDX.some(y=>y.k==='Rue'&&y.n===k)&&!IDX.some(y=>y.k==='Voie'&&y.n===k))IDX.push({t:x[3],s:'',k:'Voie',n:k,r:1,go:()=>map.flyTo([x[1],x[0]],17,{duration:.5})});});
 D.adresses.forEach((a,i)=>IDX.push({t:a[2],s:adrSub(a),k:'Adresse',n:normA(a[2]),r:2,go:()=>mode==='boitage'?ouvrirAdresseB(i):ouvrirAdresse(i)}));
 D.metro.forEach(s=>IDX.push({t:s.nom,s:'Métro '+s.lignes.join(', '),k:'Station',n:normA(s.nom+' metro station'),r:0,go:()=>ouvrirStation(s)}));
 D.marches.forEach(s=>IDX.push({t:s.nom,s:joursMarche(s),k:'Marché',n:normA(s.nom+' marche'),r:0,go:()=>ouvrirMarche(s)}));
 D.commerces.forEach(s=>IDX.push({t:(s.ens||s.type)+', '+s.adr,s:s.type,k:'Magasin',n:normA((s.ens||'')+' '+s.type+' '+s.adr),r:2,go:()=>ouvrirMagasin(s)}));
 (D.lieux_vote||[]).forEach(s=>IDX.push({t:`${s.nom}, ${s.adr}`,s:`bureau${s.bv.length>1?'x':''} ${s.bv.join(', ')}`,k:'Lieu de vote',n:normA(`${s.nom} ${s.adr} ecole bureau vote`),r:1,go:()=>{map.flyTo([s.lat,s.lon],17,{duration:.5});const b=s.bv.find(x=>BZ[x]);if(b&&mode==='pap')ouvrirBureau(b);}}));
 D.bureaux.forEach(f=>IDX.push({t:'Bureau '+f.properties.id,s:'Zone n°'+f.properties.zone,k:'Bureau',n:normA('bureau '+f.properties.id),r:0,go:()=>{if(mode!=='pap')setMode('pap');ouvrirBureau(f.properties.id);}}));}
const ICO={Rue:I.route,Voie:I.route,Adresse:I.home,Station:'<b style="font:700 12px var(--f)">M</b>','Marché':I.basket,Magasin:I.cart,Bureau:I.grid,'Lieu de vote':I.grid};
function chercher(){const q=normA($('q').value),res=$('res');$('qx').hidden=!$('q').value;if(q.length<2){res.hidden=true;return;}
 const m=q.split(' '),num=/^\d/.test(q);
 const score=x=>(x.n.startsWith(q)?0:2)+(num?(x.k==='Adresse'?-1:1):x.r)+x.t.length/200;
 let r=IDX.filter(x=>m.every(w=>x.n.includes(w))).map(x=>({x,s:score(x)}));
 if(r.length<3&&m.some(w=>w.length>5)){const deja=new Set(r.map(o=>o.x));IDX.forEach(x=>{if(deja.has(x))return;const ws=x.w||(x.w=x.n.split(' '));if(m.every(w=>x.n.includes(w)||(w.length>5&&ws.some(t=>near1(w,t)))))r.push({x,s:score(x)+3});});}
 r=r.sort((a,b)=>a.s-b.s).slice(0,12);
 res.hidden=false;res.innerHTML=r.length?r.map((o,k)=>`<button class="res" data-k="${k}"><span class="ico">${ICO[o.x.k]}</span><span><b>${esc(o.x.t)}</b><small>${esc(o.x.k)}${o.x.s?' · '+esc(o.x.s):''}</small></span></button>`).join(''):'<div class="empty">Rien trouvé dans la circonscription.</div>';
 res.querySelectorAll('.res').forEach(b=>b.onclick=()=>{const o=r[+b.dataset.k].x;res.hidden=true;$('q').blur();o.go();});}
$('q').addEventListener('input',chercher);$('q').addEventListener('focus',chercher);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('res').querySelector('.res');if(b)b.click();}if(e.key==='Escape'){$('res').hidden=true;$('q').blur();}});
$('qx').onclick=()=>{$('q').value='';$('res').hidden=true;$('qx').hidden=true;};
map.on('click',()=>{$('res').hidden=true;});
$('toParis').onclick=()=>{$('q').value='';$('res').hidden=true;ecranParis();};
$('fLeg').onclick=()=>{detail(vueLegende());if(det==='peek')setDet('half');};
let meL=null;
function localiser(fn,silent){if(!navigator.geolocation){toast('Position indisponible sur cet appareil. Touchez « Centre de la carte ».');return;}
 navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];posMoi=ll;if(meL)map.removeLayer(meL);meL=L.marker(ll,{pane:'pap',interactive:false,icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map);if(fn)fn(ll);else map.flyTo(ll,17,{duration:.5});},
  e=>toast(e&&e.code===1?'Position refusée. Pour l\'activer : réglages du téléphone, puis du navigateur, puis Position. En attendant, touchez « Centre de la carte ».':'Position introuvable ici. Réessayez dehors, ou touchez « Centre de la carte ».'),{enableHighAccuracy:true,timeout:8000,maximumAge:60000});}
$('fMe').onclick=()=>localiser(mode==='metro'?(ll=>{map.flyTo(ll,16,{duration:.5});if(vueMetroJour==='pres'){const v=stack[stack.length-1];if(v&&v.id==='base')render(true);}}):null);

/* theme */
const reth=()=>{if(D&&fondL&&map.hasLayer(fondL)){styler();dessinerParcours();dessinerLot();majBulles();}if(parisL&&map.hasLayer(parisL))stParis();};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',reth);}catch(e){}
new MutationObserver(reth).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* connexion : chacun choisit son nom et saisit la cle recue ; elle reste sur le telephone */
function connecte(){const x=LS.get('session',null);return x&&REF.users.some(u=>u.id===x.id&&u.actif)?x:null;}
function ecranConnexion(apres){const o=$('login'),sel=$('lgN'),e=$('lgE');o.hidden=false;e.hidden=true;$('lgK').value='';
 sel.innerHTML='<option value="">Choisissez votre nom</option>'+REF.users.filter(u=>u.actif).map(u=>`<option value="${u.id}">${esc(u.nom)}</option>`).join('');
 $('lgS').onclick=()=>toast('Le scan du code arrivera avec la mise en ligne.');
 $('lgGo').onclick=()=>{const id=sel.value,k=$('lgK').value.trim();if(!id){e.textContent='Choisissez votre nom.';e.hidden=false;return;}
  MOI=id;LS.set('moi',MOI);LS.set('session',{id,le:isoD(new Date())});appliquerTheme();o.hidden=true;apres();};}
function deconnecter(){LS.set('session',null);$('q').value='';$('res').hidden=true;ecranConnexion(()=>{ecranParis();const c=+LS.get('dernCirco',0)||0;if(c)choisir(c);});}

/* demarrage : connexion, puis choix de la circonscription (la derniere est proposee), ou action recue par lien */
setDet('fit');
body.innerHTML='<div class="load">Chargement…</div>';
const H0=(()=>{const m=/#(?:pap|act)=(\d+):(\d+):(?:(pap|boitage):)?([\d.]+)/.exec(location.hash||'');return m?{circo:+m[1],n:+m[2],type:m[3]||'pap',ids:m[4].split('.').map(Number)}:null;})();
function demarrer(){fetch('d/paris.json').then(r=>r.json()).then(p=>{P=p;
 if(H0&&H0.circo===6)ouvrir(6,()=>{try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(H0.n!==D.adresses.length){toast('Ce lien vient d\'une autre version des données : action non chargée.');return;}const ids=H0.ids.filter(i=>D.adresses[i]);if(ids.length)preparer(null,'',null,ids,H0.type==='boitage'?'Boîtage reçu':'Action reçue');});
 else{ecranParis();const c=+LS.get('dernCirco',0)||0;if(c)choisir(c);}}).catch(()=>{body.innerHTML='<div class="load">La carte de Paris n\'a pas pu être chargée. Vérifiez la connexion, puis réessayez.</div>';});}
if(connecte())demarrer();else ecranConnexion(demarrer);
})();
</script>
